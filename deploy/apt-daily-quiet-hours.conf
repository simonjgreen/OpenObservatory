# Move unattended package work out of the acoustically interesting hours.
#
# Installed as a drop-in over BOTH `apt-daily.timer` (download) and
# `apt-daily-upgrade.timer` (install). See ADR-067 for the measurement this is
# derived from and `docs/operations/DEPLOYMENT_AND_OPERATIONS.md` for the
# install command -- deliberately not applied by `deploy.sh`, because this is
# host policy rather than application deployment.
#
# Ubuntu's default is `OnCalendar=6:00` with `RandomizedDelaySec=60m`, which
# fires at a random moment between 06:00 and 07:00 local. On this station those
# are the two busiest hours of the entire day -- 10.0% and 11.3% of fourteen
# days of detections, the peak of the dawn chorus. The default is close to the
# worst available choice, and randomly so, which is worse still: an apt run
# that competes with the pipeline lands somewhere different every morning, so
# the days it costs something and the days it does not are indistinguishable.
#
# 15:00 is the free trough. Bird activity bottoms out at 14:00-16:00 local
# (2.7-2.8% per hour) and, unlike the quieter night hours, nothing else wants
# that window: `OO_ULTRASONIC_SCHEDULE=night` has bats under observation from
# dusk to dawn, and `open-observatory-refine.timer` runs 02:02 for 30-40
# minutes. Mid-afternoon is also the one part of the day when a human is
# plausibly around to notice a package update having broken something.

[Timer]
# Clearing first: drop-ins append to list-valued settings, so without an empty
# assignment this would run at the default 06:00 *as well* as here.
OnCalendar=
OnCalendar=*-*-* 15:00:00

# 15 minutes, not the stock 60. An hour of jitter would reach 16:00, by which
# point activity is climbing back toward the dusk peak; 15 minutes keeps every
# run inside the measured trough while still spreading load on the mirrors.
RandomizedDelaySec=15m

# The station runs continuously, so it will meet this window on its own. A
# catch-up run after a reboot is the one thing that could put apt back into the
# dawn chorus unannounced, which is precisely what this file exists to stop.
Persistent=false
