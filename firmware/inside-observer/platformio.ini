; Open Observatory - inside observer
; DIYmalls / Sunton ESP32-2432S028R ("Cheap Yellow Display")
;
; Every platform, framework, toolchain and library version below is pinned to an
; exact release. Do not widen a constraint to "^" or "~" without an ADR: this
; board has two panel revisions and several near-identical library forks, and a
; floating dependency is how a build that worked yesterday ships a garbled
; screen tomorrow.

[platformio]
name = inside-observer
default_envs = cyd
test_dir = test

; ---------------------------------------------------------------------------
; Shared settings
; ---------------------------------------------------------------------------
[common]
build_flags =
    -std=gnu++17
    -Wall
    ; ---- Application ------------------------------------------------------
    -D INSIDE_OBSERVER_VERSION=\"0.1.0\"

[env]
build_unflags = -std=gnu++11

; ---------------------------------------------------------------------------
; Target: the physical Cheap Yellow Display
; ---------------------------------------------------------------------------
[env:cyd]
platform = platformio/espressif32@6.11.0
board = esp32dev
framework = arduino

board_build.partitions = partitions/inside-observer.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    ; PaulStoffregen's library has never been tagged in the PlatformIO
    ; registry; the registry carries it as a commit pseudo-version, which is
    ; the tightest pin available and pins to an exact tree.
    paulstoffregen/XPT2046_Touchscreen@0.0.0-alpha+sha.26b691b2c8
    bblanchon/ArduinoJson@7.4.3
    ; The push transport of ADR-038. RFC6455 client, pinned to an exact release
    ; like everything else here. Chosen over hand-rolling the frame layer
    ; because masking, fragmentation and the close handshake are exactly the
    ; kind of detail that works on a bench and fails on a shelf.
    links2004/WebSockets@2.7.3
    WiFi

lib_ldf_mode = deep+

build_flags =
    ${common.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D CORE_DEBUG_LEVEL=1

    ; ---- WebSockets -------------------------------------------------------
    ; WebSockets.h picks its network class from a macro chain
    ; (`WEBSOCKETS_NETWORK_TYPE == NETWORK_ESP32`) and then includes <WiFi.h>.
    ; The library dependency finder cannot evaluate that chain - both sides are
    ; macros defined in the same header - so it never records WiFi as a
    ; dependency *of WebSockets*, and that library compiles without the
    ; framework WiFi library on its include path even though the application
    ; itself compiles against it fine. Naming the paths here is the fix that
    ; does not involve patching a pinned dependency in place.
    -I $PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/WiFi/src
    -I $PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/WiFiClientSecure/src
    -I $PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/Network/src

    ; ---- TFT_eSPI configuration -------------------------------------------
    ; Set here rather than by editing User_Setup.h inside the library, so the
    ; library checkout stays pristine and the configuration is version
    ; controlled with the application.
    ;
    ; Values from witnessmenow/ESP32-Cheap-Yellow-Display
    ;   DisplayConfig/User_Setup.h and PINS.md, cross-checked against
    ;   randomnerdtutorials.com/esp32-cheap-yellow-display-cyd-pinout-esp32-2432s028r/
    ; See README.md for the full source attribution table.
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    ; The panel on this board is BGR-ordered but NOT inverted.
    ;
    ; TFT_eSPI discussion #3018 (Bodmer) reports inversion for some
    ; ESP32-2432S028R revisions, and this build originally trusted that.
    ; On the operator's actual unit it is wrong: with TFT_INVERSION_ON the
    ; screen rendered dark navy text on pale blue, which is precisely the
    ; near-black background and warm off-white text inverted. BGR order is
    ; correct as-is — had it also been wrong, the inverted text would have
    ; read dark brown/red rather than navy.
    ;
    ; Confirmed by photograph of the running unit, 2026-08-08. Panel
    ; identity itself is measured, not assumed: RDID4 (0xD3) returns
    ; 0x..9341. See README "Panel identification".
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_OFF=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    ; Display is on HSPI. Touch is a separate XPT2046 on VSPI and is NOT
    ; driven by TFT_eSPI, hence no TOUCH_CS here.
    -D USE_HSPI_PORT=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 460800
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0

; ---------------------------------------------------------------------------
; Host-side unit tests for the pure logic (no hardware, no Arduino)
;
;   pio test -e native
;
; Everything under src/model/ is deliberately free of Arduino, WiFi and
; TFT_eSPI so that detection parsing, threshold filtering, feed ordering and
; time formatting are testable on a laptop.
; ---------------------------------------------------------------------------
[env:native]
platform = platformio/native@1.2.1
test_framework = unity
; Link the model sources into the test binary. Only src/model/ is built here
; (see build_src_filter): everything else in src/ is Arduino-only by design.
test_build_src = yes
build_flags =
    ${common.build_flags}
    -I src
    -D INSIDE_OBSERVER_HOST_TEST=1
    ; Unity ships with double assertions compiled out by default.
    -D UNITY_INCLUDE_DOUBLE
    -D UNITY_DOUBLE_PRECISION=1e-9
lib_deps =
    bblanchon/ArduinoJson@7.4.3
lib_compat_mode = off
build_src_filter = +<model/>
