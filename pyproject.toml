[project]
name = "open-observatory"
version = "0.3.0"
description = "Local-first passive acoustic observatory for Raspberry Pi 5 + AudioMoth"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }

dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.1",
  "SQLAlchemy==2.0.36",
  "alembic==1.14.0",
  "numpy==2.2.1",
  "soundfile==0.13.0",
  "typer==0.15.1",
  # Pinned, not left to typer's own `click>=8.0.0` range. click 8.2 changed
  # `Parameter.make_metavar()` to require a `ctx` argument; typer 0.15.1 still
  # calls it with none, so any fresh install resolving click >=8.2 makes every
  # `oo ... --help` die with a TypeError before printing anything. Found on
  # 2026-08-08 with click 8.4.2 -- on this laptop AND on the live station, so
  # the operator CLI documented in HANDOVER.md was already broken there.
  "click==8.1.8",
  "rich==13.9.4",
  "structlog==24.4.0",
  "prometheus-client==0.21.1",
  "psutil==6.1.1",
  # Async MQTT client for the Milestone 6 publisher (config.py: mqtt_enabled,
  # off by default). Pure-Python wheel, no native build step, so unlike the
  # `alsa`/`birdnet` extras there is no reason to make it opt-in.
  "aiomqtt==2.3.0",
  # Password hashing for the Milestone 4 auth foundation (ADR-034). Argon2id,
  # winner of the 2015 Password Hashing Competition and OWASP's current
  # recommendation; cost parameters are pinned separately in config.py so a
  # future library upgrade cannot silently change station security posture.
  "argon2-cffi==23.1.0",
]

[project.optional-dependencies]
# ALSA capture on the target device.
alsa = ["pyalsaaudio==0.11.0"]
# Preferred high-quality polyphase resampler. Falls back to scipy when absent.
resample = ["soxr==0.5.0.post1", "scipy==1.15.0"]
# TFLite inference for the BirdNET adapter. `tflite-runtime` has no cp312
# aarch64 wheel; ai-edge-litert is its maintained successor and does.
birdnet = ["ai-edge-litert==2.1.6"]
# PostgreSQL production profile (ADR-007).
postgres = ["psycopg[binary]==3.2.3"]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.1",
  "httpx==0.28.1",
  "ruff==0.8.6",
  "mypy==1.14.1",
  # Validates real emitted events against schemas/detection-event.schema.json
  # (tests/test_mqtt_schema.py) so the envelope cannot drift unnoticed again.
  "jsonschema==4.23.0",
  "hypothesis==6.123.2",
]

[project.scripts]
oo = "open_observatory.cli:app"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# 110 rather than the more common 88/100: this codebase favours descriptive names
# and explanatory inline comments, and wrapping them harder hurt readability more
# than the extra columns cost.
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
packages = ["open_observatory"]
mypy_path = "src"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]
