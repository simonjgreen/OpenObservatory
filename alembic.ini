[alembic]
# The migration environment itself (alembic/env.py) resolves the real database
# URL from the project's own Settings (config.py -> resolved_database_dsn), the
# same OO_DATABASE_DSN-driven resolution the application uses. The value below
# is a placeholder only: alembic.config.main() requires *something* parseable
# here even though env.py overwrites it before any engine is created, and
# `alembic history`/`alembic show` (which never touch a database) still parse
# this file. Do not point this at a real database path; it is not read for
# connections.
script_location = alembic
sqlalchemy.url = sqlite+pysqlite:///unused-see-env-py.sqlite

# Template used to generate migration file names.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Max length of characters to apply to the "slug" field
truncate_slug_length = 60

# Timezone for revision timestamps embedded in generated files. UTC per
# CLAUDE.md ("Use UTC internally").
timezone = UTC

# version path separator
version_path_separator = os

[post_write_hooks]
# Left empty deliberately: ruff/mypy already run over generated files as part
# of the normal pre-commit and CI gates, no need to duplicate that here.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
